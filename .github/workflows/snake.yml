name: Gerar cobra

on:
  schedule:
    - cron: "0 0 * * *"   # todos os dias à meia-noite
  workflow_dispatch:       # permite correr à mão
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#8FA35A&color_dots=#161b22,#2f3b1a,#3f4f24,#556B2F,#7a9a3f

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
