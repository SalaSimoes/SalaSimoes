name: Gerar cobra

on:
  schedule:
    - cron: "0 0 * * *"   # todos os dias à meia-noite
  workflow_dispatch:       # permite correr à mão
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Contar contribuições do último ano
        env:
          GH_TOKEN: ${{ secrets.SNAKE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          TOTAL=$(gh api graphql \
            -f query='query($u:String!){user(login:$u){contributionsCollection{contributionCalendar{totalContributions}}}}' \
            -F u="${{ github.repository_owner }}" \
            --jq '.data.user.contributionsCollection.contributionCalendar.totalContributions')
          cat > dist/contribuicoes.svg <<SVG
          <svg xmlns="http://www.w3.org/2000/svg" width="600" height="70" viewBox="0 0 600 70">
            <style>
              .n { font: 700 34px 'Segoe UI', Ubuntu, sans-serif; fill: #8FA35A; }
              .l { font: 400 16px 'Segoe UI', Ubuntu, sans-serif; fill: #8b949e; }
            </style>
            <text x="300" y="38" text-anchor="middle" class="n">${TOTAL}</text>
            <text x="300" y="62" text-anchor="middle" class="l">contribuições no último ano</text>
          </svg>
          SVG

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#8FA35A&color_dots=#161b22,#2f3b1a,#3f4f24,#556B2F,#7a9a3f

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
